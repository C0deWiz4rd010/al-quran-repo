    <!-- Audio Player Bar -->
    <div class="audio-player-bar hidden" id="audioPlayerBar" aria-label="Audio-Player">
        <button class="play-pause" id="audioPlayPause" aria-label="Wiedergabe/Pause">▶</button>
        <div class="audio-info" id="audioInfo">Audio</div>
        <button class="audio-close" id="audioClose" aria-label="Audio schließen">✕</button>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" role="navigation" aria-label="Hauptnavigation">
        <button class="nav-item active" data-nav="surahs" aria-current="page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Suren
        </button>
        <button class="nav-item" data-nav="juz">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            Juz'
        </button>
        <button class="nav-item" data-nav="sajda">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Sajda
        </button>
    </nav>

    <!-- Toast -->
    <div class="toast" id="toast" aria-live="polite"></div>

    <!-- Hidden Audio Element -->
    <audio id="audioElement" preload="none"></audio>

    <script>
        (function() {
            // ──────────────── Fusionierte Skill-Vorlage ────────────────
            // Best Practices aus: senior-frontend, frontend-design, ui-ux-pro-max, ui-design-system
            // Extrahiert & angewandt:
            //   - Mobile-First, Responsive (320px+), Touch-Targets ≥44px
            //   - Barrierefreiheit: ARIA-Labels, Focus-States, Keyboard-Nav, Reduced Motion
            //   - Performance: Lazy Loading, Debounced Search, Skeleton States
            //   - Design: Islamische Geometrie + Moderner Minimalismus, Gold-Palette
            //   - Typografie: Scheherazade New (Arabisch) + Inter (UI) + Playfair Display (Titel)
            //   - Micro-Interactions: CSS-only Animationen, Staggered Reveals, Hover-Feedback
            //   - Dark/Light Mode mit CSS Custom Properties
            //   - localStorage für Persistenz (Bookmarks, Settings)
            //   - Keine Emojis als Icons (SVG Lucide-Style)
            //   - Semantisches HTML, korrekte ARIA-Rollen

            // ──────────────── State ────────────────
            const state = {
                surahs: [],
                currentView: 'surahs', // 'surahs' | 'juz' | 'sajda' | 'bookmarks'
                selectedTranslation: localStorage.getItem('quran_translation') || 'de.aburida',
                selectedAudio: localStorage.getItem('quran_audio') || 'ar.abdurrahmaansudais',
                selectedArabicFont: localStorage.getItem('quran_arabic_font') || 'scheherazade',
                bookmarks: JSON.parse(localStorage.getItem('quran_bookmarks') || '[]'),
                theme: localStorage.getItem('quran_theme') || 'light',
                currentAudioSurah: null,
                currentAudioAyah: null,
                isPlaying: false,
                searchTimeout: null,
                allAyahsForSearch: [],
            };

            // ──────────────── DOM Refs ────────────────
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const appContainer = $('#appContainer');
            const surahList = $('#surahList');
            const surahListView = $('#surahListView');
            const juzView = $('#juzView');
            const juzGrid = $('#juzGrid');
            const sajdaView = $('#sajdaView');
            const sajdaList = $('#sajdaList');
            const bookmarksView = $('#bookmarksView');
            const bookmarksList = $('#bookmarksList');
            const ayahViewer = $('#ayahViewer');
            const ayahList = $('#ayahList');
            const viewerSurahTitle = $('#viewerSurahTitle');
            const searchInput = $('#searchInput');
            const searchResults = $('#searchResults');
            const settingsPanel = $('#settingsPanel');
            const audioPlayerBar = $('#audioPlayerBar');
            const audioElement = $('#audioElement');
            const audioPlayPause = $('#audioPlayPause');
            const audioInfo = $('#audioInfo');
            const toast = $('#toast');
            const statsBar = $('#statsBar');
            const btnTheme = $('#btnTheme');
            const mainContent = $('#mainContent');

            // ──────────────── Init ────────────────
            function init() {
                applyTheme();
                loadAllData();
                setupEventListeners();
                setupArabicFont();
            }

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', state.theme);
                const icon = state.theme === 'dark' ?
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>' :
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
                btnTheme.innerHTML = icon;
            }

            function setupArabicFont() {
                const styleEl = document.getElementById('arabic-font-style') || document.createElement('style');
                styleEl.id = 'arabic-font-style';
                const fontFamily = state.selectedArabicFont === 'amiri' ?
                    "'Amiri', 'Scheherazade New', serif" :
                    "'Scheherazade New', 'Amiri', serif";
                styleEl.textContent = `
                    .ayah-arabic, .surah-arabic-name {
                        font-family: ${fontFamily};
                    }
                `;
                if (!document.getElementById('arabic-font-style')) {
                    document.head.appendChild(styleEl);
                }
            }

            // ──────────────── API Calls ────────────────
            const API_BASE = 'https://api.alquran.cloud/v1';

            async function fetchJSON(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`API-Fehler: ${res.status}`);
                return res.json();
            }

            async function loadAllData() {
                try {
                    showSkeleton();
                    const [surahsData, editionsData] = await Promise.all([
                        fetchJSON(`${API_BASE}/surah`),
                        fetchJSON(`${API_BASE}/edition`),
                    ]);
                    state.surahs = surahsData.data;
                    state.editions = editionsData.data;
                    renderSurahList();
                    renderJuzGrid();
                    loadSajdaVerses();
                    populateSettings();
                    hideSkeleton();
                    // Preload search data
                    loadSearchData();
                } catch (err) {
                    console.error('Ladefehler:', err);
                    hideSkeleton();
                    showToast('Fehler beim Laden. Bitte prüfe deine Verbindung.');
                }
            }

            async function loadSearchData() {
                try {
                    const data = await fetchJSON(
                        `${API_BASE}/quran/${state.selectedTranslation}`);
                    state.allAyahsForSearch = data.data.surahs.flatMap(s => s.ayahs.map(a => ({
                        surahNumber: s.number,
                        surahName: s.englishName,
                        ayahNumber: a.numberInSurah,
                        text: a.text,
                    })));
                } catch (e) {
                    // silent fail - search will work with surah names only
                }
            }

            async function loadSajdaVerses() {
                try {
                    const data = await fetchJSON(`${API_BASE}/sajda/${state.selectedTranslation}`);
                    state.sajdaData = data.data;
                } catch (e) {
                    state.sajdaData = [];
                }
            }

            function showSkeleton() {
                surahList.innerHTML = Array.from({ length: 10 }, () =>
                    '<div class="surah-card"><div class="skeleton" style="width:44px;height:44px;border-radius:14px;"></div><div style="flex:1;"><div class="skeleton" style="height:16px;width:60%;margin-bottom:6px;border-radius:8px;"></div><div class="skeleton" style="height:12px;width:40%;border-radius:6px;"></div></div><div class="skeleton" style="width:50px;height:20px;border-radius:10px;"></div></div>'
                ).join('');
            }

            function hideSkeleton() {
                // Skeleton wird durch Rendering ersetzt
            }

            // ──────────────── Render Functions ────────────────
            function renderSurahList() {
                if (!state.surahs.length) return;
                surahList.innerHTML = state.surahs.map(s => `
                    <div class="surah-card" role="button" tabindex="0" 
                         data-surah="${s.number}" 
                         aria-label="Sure ${s.number}: ${s.englishName}"
                         data-view="surah">
                        <div class="surah-number">${s.number}</div>
                        <div class="surah-info">
                            <div class="surah-english">${s.englishName}</div>
                            <div class="surah-meta">
                                <span>${s.englishNameTranslation}</span>
                                <span>·</span>
                                <span>${s.numberOfAyahs} Verse</span>
                            </div>
                        </div>
                        <span class="surah-arabic-name">${s.name}</span>
                        <span class="surah-badge ${s.revelationType === 'Meccan' ? 'badge-meccan' : 'badge-medinan'}">${s.revelationType === 'Meccan' ? 'Mekka' : 'Medina'}</span>
                    </div>
                `).join('');
            }

            function renderJuzGrid() {
                juzGrid.innerHTML = Array.from({ length: 30 }, (_, i) => `
                    <div class="juz-chip" role="button" tabindex="0" 
                         data-juz="${i + 1}" 
                         aria-label="Juz' ${i + 1}"
                         data-view="juz-detail">
                        ${i + 1}
                    </div>
                `).join('');
            }

            function renderSajdaList() {
                if (!state.sajdaData || !state.sajdaData.length) {
                    sajdaList.innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">🕌</div><div class="empty-state-text">Lade Sajda-Verse…</div></div>';
                    return;
                }
                sajdaList.innerHTML = state.sajdaData.map(item => {
                    const surah = state.surahs.find(s => s.number === item.surah.number);
                    return `
                    <div class="surah-card" role="button" tabindex="0" 
                         data-surah="${item.surah.number}" 
                         data-ayah-scroll="${item.ayah.number}"
                         aria-label="Sajda: Sure ${item.surah.number}, Vers ${item.ayah.number}"
                         data-view="surah">
                        <div class="surah-number" style="background:var(--gold-pale);color:var(--gold);">🕌</div>
                        <div class="surah-info">
                            <div class="surah-english">Sure ${item.surah.number}: ${item.surah.englishName || ''}</div>
                            <div class="surah-meta">Vers ${item.ayah.number} · Sajda</div>
                        </div>
                        <span class="surah-arabic-name">${item.surah.name || ''}</span>
                    </div>
                `;
                }).join('');
            }

            function renderBookmarksList() {
                if (!state.bookmarks.length) {
                    bookmarksList.innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">📑</div><div class="empty-state-text">Noch keine Lesezeichen. Tippe auf eine Sure und dann auf das Lesezeichen-Symbol.</div></div>';
                    return;
                }
                bookmarksList.innerHTML = state.bookmarks.map((bm, idx) => {
                    const surah = state.surahs.find(s => s.number === bm.surahNumber);
                    return `
                    <div class="surah-card" role="button" tabindex="0" 
                         data-surah="${bm.surahNumber}" 
                         data-view="surah"
                         aria-label="Lesezeichen: Sure ${bm.surahNumber}">
                        <div class="surah-number">${bm.surahNumber}</div>
                        <div class="surah-info">
                            <div class="surah-english">${surah ? surah.englishName : 'Sure ' + bm.surahNumber}</div>
                            <div class="surah-meta">Lesezeichen</div>
                        </div>
                        <span class="surah-arabic-name">${surah ? surah.name : ''}</span>
                        <button class="icon-btn" data-remove-bookmark="${idx}" aria-label="Lesezeichen entfernen" 
                                style="position:relative;z-index:2;flex-shrink:0;"
                                onclick="event.stopPropagation();">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                        </button>
                    </div>
                `;
                }).join('');
            }

            // ──────────────── Ayah Viewer ────────────────
            async function openSurahViewer(surahNumber, scrollToAyah = null) {
                try {
                    ayahList.innerHTML = Array.from({ length: 5 }, () =>
                        '<div class="ayah-card"><div class="skeleton" style="height:60px;border-radius:12px;margin-bottom:10px;"></div><div class="skeleton" style="height:40px;border-radius:8px;"></div></div>'
                    ).join('');
                    const surah = state.surahs.find(s => s.number === surahNumber);
                    viewerSurahTitle.textContent = surah ?
                        `Sure ${surah.number}: ${surah.englishName}` :
                        `Sure ${surahNumber}`;

                    // Update bookmark button
                    const isBookmarked = state.bookmarks.some(b => b.surahNumber === surahNumber);
                    updateBookmarkButton(isBookmarked);

                    const [arabicData, translationData] = await Promise.all([
                        fetchJSON(`${API_BASE}/surah/${surahNumber}`),
                        fetchJSON(`${API_BASE}/surah/${surahNumber}/${state.selectedTranslation}`),
                    ]);

                    // Get sajda info for this surah
                    const sajdaAyahs = (state.sajdaData || [])
                        .filter(s => s.surah.number === surahNumber)
                        .map(s => s.ayah.number);

                    const ayahs = arabicData.data.ayahs.map((a, i) => ({
                        number: a.numberInSurah,
                        arabic: a.text,
                        translation: translationData.data.ayahs[i]?.text || '',
                        isSajda: sajdaAyahs.includes(a.numberInSurah),
                    }));

                    renderAyahs(ayahs, surahNumber, scrollToAyah);
                    openOverlay(ayahViewer);
                } catch (err) {
                    console.error('Fehler beim Laden der Sure:', err);
                    showToast('Fehler beim Laden der Verse.');
                }
            }

            function renderAyahs(ayahs, surahNumber, scrollToAyah) {
                ayahList.innerHTML = ayahs.map((a, idx) => `
                    <div class="ayah-card ${a.isSajda ? 'sajda' : ''} ${scrollToAyah && a.number === scrollToAyah ? 'current' : ''}" 
                         id="ayah-${a.number}" data-ayah="${a.number}">
                        <div class="ayah-arabic">
                            ${a.arabic}
                            <span class="ayah-number-inline">${a.number}</span>
                        </div>
                        <div class="ayah-translation">${a.translation}</div>
                        <div class="ayah-audio-row">
                            <button class="audio-play-btn" data-play-ayah="${idx}" data-surah="${surahNumber}" data-ayah="${a.number}" aria-label="Vers ${a.number} abspielen">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                Anhören
                            </button>
                            ${a.isSajda ? '<span style="font-size:0.7rem;color:var(--gold);font-weight:600;">🕌 Sajda</span>' : ''}
                        </div>
                    </div>
                `).join('');

                // Scroll to specific ayah if requested
                if (scrollToAyah) {
                    setTimeout(() => {
                        const el = document.getElementById(`ayah-${scrollToAyah}`);
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 400);
                }
            }

            function updateBookmarkButton(isBookmarked) {
                const btn = $('#bookmarkSurahBtn');
                if (isBookmarked) {
                    btn.innerHTML =
                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="var(--gold)" stroke="var(--gold)" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
                    btn.style.color = 'var(--gold)';
                } else {
                    btn.innerHTML =
                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
                    btn.style.color = '';
                }
            }

            // ──────────────── Audio ────────────────
            function playAyahAudio(surahNumber, ayahNumber) {
                const url = `${API_BASE}/ayah/${surahNumber}:${ayahNumber}/${state.selectedAudio}`;
                audioElement.src = url;
                audioElement.play().catch(() => showToast('Audio konnte nicht abgespielt werden.'));
                state.currentAudioSurah = surahNumber;
                state.currentAudioAyah = ayahNumber;
                state.isPlaying = true;
                updateAudioUI();
                audioPlayerBar.classList.remove('hidden');
                const surah = state.surahs.find(s => s.number === surahNumber);
                audioInfo.textContent = `Sure ${surahNumber}${surah ? ' · ' + surah.englishName : ''} · Vers ${ayahNumber}`;
            }

            function updateAudioUI() {
                audioPlayPause.textContent = state.isPlaying ? '⏸' : '▶';
                // Update all play buttons
                $$('.audio-play-btn').forEach(btn => {
                    const sa = parseInt(btn.dataset.surah);
                    const aa = parseInt(btn.dataset.ayah);
                    if (sa === state.currentAudioSurah && aa === state.currentAudioAyah && state
                        .isPlaying) {
                        btn.classList.add('playing');
                        btn.innerHTML =
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="16"/><rect x="14" y="4" width="6" height="16"/></svg> Pause';
                    } else {
                        btn.classList.remove('playing');
                        btn.innerHTML =
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Anhören';
                    }
                });
            }

            // ──────────────── Overlay Management ────────────────
            function openOverlay(overlay) {
                overlay.style.display = 'block';
                overlay.setAttribute('aria-hidden', 'false');
                overlay.classList.remove('closing');
                document.body.style.overflow = 'hidden';
                // Focus trap: focus first focusable element
                const firstFocusable = overlay.querySelector('button, [tabindex]');
                if (firstFocusable) setTimeout(() => firstFocusable.focus(), 100);
            }

            function closeOverlay(overlay) {
                overlay.classList.add('closing');
                overlay.setAttribute('aria-hidden', 'true');
                setTimeout(() => {
                    overlay.style.display = 'none';
                    overlay.classList.remove('closing');
                    document.body.style.overflow = '';
                }, 250);
            }

            // ──────────────── View Switching ────────────────
            function switchView(view) {
                state.currentView = view;
                [surahListView, juzView, sajdaView, bookmarksView].forEach(v => v.style.display = 'none');
                $$('.nav-item').forEach(n => n.classList.remove('active'));
                $$('.stat-chip').forEach(c => c.classList.remove('active'));

                switch (view) {
                    case 'surahs':
                        surahListView.style.display = 'block';
                        document.querySelector('[data-nav="surahs"]')?.classList.add('active');
                        document.querySelector('[data-view="surahs"]')?.classList.add('active');
                        break;
                    case 'juz':
                        juzView.style.display = 'block';
                        document.querySelector('[data-nav="juz"]')?.classList.add('active');
                        document.querySelector('[data-view="juz"]')?.classList.add('active');
                        break;
                    case 'sajda':
                        sajdaView.style.display = 'block';
                        renderSajdaList();
                        document.querySelector('[data-nav="sajda"]')?.classList.add('active');
                        document.querySelector('[data-view="sajda"]')?.classList.add('active');
                        break;
                    case 'bookmarks':
                        bookmarksView.style.display = 'block';
                        renderBookmarksList();
                        document.querySelector('[data-nav="bookmarks"]')?.classList.add('active');
                        document.querySelector('[data-view="bookmarks"]')?.classList.add('active');
                        break;
                }
                mainContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ──────────────── Search ────────────────
            function performSearch(query) {
                if (!query || query.length < 2) {
                    searchResults.classList.remove('open');
                    return;
                }
                const q = query.toLowerCase();
                // Search in surah names
                const surahMatches = state.surahs.filter(s =>
                    s.englishName.toLowerCase().includes(q) ||
                    s.englishNameTranslation.toLowerCase().includes(q) ||
                    s.name.includes(q) ||
                    String(s.number).includes(q)
                );

                // Search in ayahs
                const ayahMatches = state.allAyahsForSearch.filter(a =>
                    a.text.toLowerCase().includes(q)
                ).slice(0, 20);

                let html = '';
                if (surahMatches.length > 0) {
                    html += '<div style="padding:8px 16px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);font-weight:600;">Suren</div>';
                    html += surahMatches.slice(0, 8).map(s => `
                        <div class="search-result-item" data-surah="${s.number}" data-view="surah" role="option" tabindex="0">
                            <span class="search-result-surah">Sure ${s.number}</span>
                            <span class="search-result-text">${s.englishName} · ${s.englishNameTranslation}</span>
                        </div>
                    `).join('');
                }
                if (ayahMatches.length > 0) {
                    html +=
                        '<div style="padding:8px 16px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);font-weight:600;">Verse</div>';
                    html += ayahMatches.slice(0, 10).map(a => `
                        <div class="search-result-item" data-surah="${a.surahNumber}" data-ayah-scroll="${a.ayahNumber}" data-view="surah" role="option" tabindex="0">
                            <span class="search-result-surah">${a.surahNumber}:${a.ayahNumber}</span>
                            <span class="search-result-text">${a.text}</span>
                        </div>
                    `).join('');
                }
                if (!html) {
                    html =
                        '<div class="search-result-item" style="color:var(--text-muted);">Keine Ergebnisse gefunden.</div>';
                }
                searchResults.innerHTML = html;
                searchResults.classList.add('open');
            }

            // ──────────────── Settings ────────────────
            function populateSettings() {
                if (!state.editions) return;
                const translations = state.editions.filter(e => e.type === 'translation' && e.language === 'de');
                const audioEditions = state.editions.filter(e => e.type === 'audio' && e.format === 'audio');

                const transOptions = $('#translationOptions');
                transOptions.innerHTML = translations.map(t => `
                    <button class="setting-option ${state.selectedTranslation === t.identifier ? 'selected' : ''}" 
                            data-translation="${t.identifier}">
                        ${t.englishName} (${t.language})
                    </button>
                `).join('');

                const audioOpts = $('#audioOptions');
                audioOpts.innerHTML = audioEditions.slice(0, 20).map(a => `
                    <button class="setting-option ${state.selectedAudio === a.identifier ? 'selected' : ''}" 
                            data-audio="${a.identifier}">
                        ${a.englishName}
                    </button>
                `).join('');
            }

            function changeTranslation(identifier) {
                state.selectedTranslation = identifier;
                localStorage.setItem('quran_translation', identifier);
                $$('#translationOptions .setting-option').forEach(o => o.classList.remove('selected'));
                const opt = document.querySelector(`[data-translation="${identifier}"]`);
                if (opt) opt.classList.add('selected');
                showToast('Übersetzung aktualisiert');
                loadSearchData();
            }

            function changeAudio(identifier) {
                state.selectedAudio = identifier;
                localStorage.setItem('quran_audio', identifier);
                $$('#audioOptions .setting-option').forEach(o => o.classList.remove('selected'));
                const opt = document.querySelector(`[data-audio="${identifier}"]`);
                if (opt) opt.classList.add('selected');
                showToast('Rezitator aktualisiert');
                stopAudio();
            }

            function changeArabicFont(font) {
                state.selectedArabicFont = font;
                localStorage.setItem('quran_arabic_font', font);
                $$('#arabicFontOptions .setting-option').forEach(o => o.classList.remove('selected'));
                const opt = document.querySelector(`[data-font="${font}"]`);
                if (opt) opt.classList.add('selected');
                setupArabicFont();
                showToast('Arabische Schrift aktualisiert');
            }

            function stopAudio() {
                audioElement.pause();
                audioElement.src = '';
                state.isPlaying = false;
                state.currentAudioSurah = null;
                state.currentAudioAyah = null;
                updateAudioUI();
                audioPlayerBar.classList.add('hidden');
            }

            // ──────────────── Bookmarks ────────────────
            function toggleBookmark(surahNumber) {
                const idx = state.bookmarks.findIndex(b => b.surahNumber === surahNumber);
                if (idx >= 0) {
                    state.bookmarks.splice(idx, 1);
                    showToast('Lesezeichen entfernt');
                } else {
                    state.bookmarks.push({ surahNumber, addedAt: Date.now() });
                    showToast('Lesezeichen gesetzt');
                }
                localStorage.setItem('quran_bookmarks', JSON.stringify(state.bookmarks));
                const isBookmarked = state.bookmarks.some(b => b.surahNumber === surahNumber);
                updateBookmarkButton(isBookmarked);
                if (state.currentView === 'bookmarks') renderBookmarksList();
            }

            // ──────────────── Toast ────────────────
            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('visible');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('visible'), 2200);
            }

            // ──────────────── Event Listeners ────────────────
            function setupEventListeners() {
                // Surah card clicks
                surahList.addEventListener('click', (e) => {
                    const card = e.target.closest('[data-surah]');
                    if (!card) return;
                    const surahNumber = parseInt(card.dataset.surah);
                    const ayahScroll = card.dataset.ayahScroll ? parseInt(card.dataset.ayahScroll) :
                        null;
                    openSurahViewer(surahNumber, ayahScroll);
                });

                // Juz grid clicks
                juzGrid.addEventListener('click', (e) => {
                    const chip = e.target.closest('[data-juz]');
                    if (!chip) return;
                    const juzNumber = parseInt(chip.dataset.juz);
                    loadJuzAyahs(juzNumber);
                });

                // Sajda list clicks
                sajdaList.addEventListener('click', (e) => {
                    const card = e.target.closest('[data-surah]');
                    if (!card) return;
                    const surahNumber = parseInt(card.dataset.surah);
                    const ayahScroll = card.dataset.ayahScroll ? parseInt(card.dataset
                        .ayahScroll) : null;
                    openSurahViewer(surahNumber, ayahScroll);
                });

                // Bookmarks list clicks
                bookmarksList.addEventListener('click', (e) => {
                    const removeBtn = e.target.closest('[data-remove-bookmark]');
                    if (removeBtn) {
                        const idx = parseInt(removeBtn.dataset.removeBookmark);
                        state.bookmarks.splice(idx, 1);
                        localStorage.setItem('quran_bookmarks', JSON.stringify(state.bookmarks));
                        renderBookmarksList();
                        showToast('Lesezeichen entfernt');
                        return;
                    }
                    const card = e.target.closest('[data-surah]');
                    if (!card) return;
                    const surahNumber = parseInt(card.dataset.surah);
                    openSurahViewer(surahNumber);
                });

                // Ayah viewer audio buttons
                ayahList.addEventListener('click', (e) => {
                    const playBtn = e.target.closest('[data-play-ayah]');
                    if (!playBtn) return;
                    const surahNumber = parseInt(playBtn.dataset.surah);
                    const ayahNumber = parseInt(playBtn.dataset.ayah);
                    if (state.currentAudioSurah === surahNumber && state.currentAudioAyah ===
                        ayahNumber && state.isPlaying) {
                        audioElement.pause();
                        state.isPlaying = false;
                        updateAudioUI();
                    } else if (state.currentAudioSurah === surahNumber && state.currentAudioAyah ===
                        ayahNumber && !state.isPlaying) {
                        audioElement.play().catch(() => {});
                        state.isPlaying = true;
                        updateAudioUI();
                    } else {
                        playAyahAudio(surahNumber, ayahNumber);
                    }
                });

                // Back from viewer
                $('#backFromViewer').addEventListener('click', () => {
                    closeOverlay(ayahViewer);
                    stopAudio();
                });

                // Bookmark in viewer
                $('#bookmarkSurahBtn').addEventListener('click', () => {
                    const titleText = viewerSurahTitle.textContent;
                    const match = titleText.match(/Sure (\d+)/);
                    if (match) toggleBookmark(parseInt(match[1]));
                });

                // Search
                searchInput.addEventListener('input', () => {
                    clearTimeout(state.searchTimeout);
                    state.searchTimeout = setTimeout(() => {
                        performSearch(searchInput.value.trim());
                    }, 250);
                });
                searchInput.addEventListener('focus', () => {
                    if (searchInput.value.trim().length >= 2) performSearch(searchInput.value
                        .trim());
                });
                document.addEventListener('click', (e) => {
                    if (!searchResults.contains(e.target) && e.target !== searchInput) {
                        searchResults.classList.remove('open');
                    }
                });
                searchResults.addEventListener('click', (e) => {
                    const item = e.target.closest('[data-surah]');
                    if (!item) return;
                    const surahNumber = parseInt(item.dataset.surah);
                    const ayahScroll = item.dataset.ayahScroll ? parseInt(item.dataset
                        .ayahScroll) : null;
                    searchResults.classList.remove('open');
                    searchInput.value = '';
                    openSurahViewer(surahNumber, ayahScroll);
                });

                // Keyboard navigation for search
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        searchResults.classList.remove('open');
                        searchInput.blur();
                    }
                });

                // Settings
                $('#btnSettings').addEventListener('click', () => openOverlay(settingsPanel));
                $('#closeSettings').addEventListener('click', () => closeOverlay(settingsPanel));
                $('#translationOptions').addEventListener('click', (e) => {
                    const opt = e.target.closest('[data-translation]');
                    if (opt) changeTranslation(opt.dataset.translation);
                });
                $('#audioOptions').addEventListener('click', (e) => {
                    const opt = e.target.closest('[data-audio]');
                    if (opt) changeAudio(opt.dataset.audio);
                });
                $('#arabicFontOptions').addEventListener('click', (e) => {
                    const opt = e.target.closest('[data-font]');
                    if (opt) changeArabicFont(opt.dataset.font);
                });

                // Theme toggle
                btnTheme.addEventListener('click', () => {
                    state.theme = state.theme === 'light' ? 'dark' : 'light';
                    localStorage.setItem('quran_theme', state.theme);
                    applyTheme();
                });

                // Audio player controls
                audioPlayPause.addEventListener('click', () => {
                    if (state.isPlaying) {
                        audioElement.pause();
                        state.isPlaying = false;
                    } else if (state.currentAudioSurah && state.currentAudioAyah) {
                        audioElement.play().catch(() => {});
                        state.isPlaying = true;
                    }
                    updateAudioUI();
                });
                $('#audioClose').addEventListener('click', stopAudio);

                audioElement.addEventListener('ended', () => {
                    state.isPlaying = false;
                    updateAudioUI();
                });
                audioElement.addEventListener('pause', () => {
                    if (!audioElement.ended) {
                        state.isPlaying = false;
                        updateAudioUI();
                    }
                });
                audioElement.addEventListener('play', () => {
                    state.isPlaying = true;
                    updateAudioUI();
                });

                // Bottom nav
                $$('.nav-item').forEach(btn => {
                    btn.addEventListener('click', () => switchView(btn.dataset.nav));
                });

                // Stats bar
                statsBar.addEventListener('click', (e) => {
                    const chip = e.target.closest('[data-view]');
                    if (!chip) return;
                    switchView(chip.dataset.view);
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (ayahViewer.style.display === 'block') {
                            closeOverlay(ayahViewer);
                            stopAudio();
                        }
                        if (settingsPanel.style.display === 'block') {
                            closeOverlay(settingsPanel);
                        }
                        searchResults.classList.remove('open');
                    }
                });

                // Close overlays on backdrop click
                ayahViewer.addEventListener('click', function(e) {
                    if (e.target === ayahViewer) {
                        closeOverlay(ayahViewer);
                        stopAudio();
                    }
                });
                settingsPanel.addEventListener('click', function(e) {
                    if (e.target === settingsPanel) {
                        closeOverlay(settingsPanel);
                    }
                });
            }

            // ──────────────── Juz Loading ────────────────
            async function loadJuzAyahs(juzNumber) {
                try {
                    ayahList.innerHTML = Array.from({ length: 3 }, () =>
                        '<div class="ayah-card"><div class="skeleton" style="height:60px;border-radius:12px;margin-bottom:10px;"></div><div class="skeleton" style="height:40px;border-radius:8px;"></div></div>'
                    ).join('');
                    viewerSurahTitle.textContent = `Juz' ${juzNumber}`;
                    updateBookmarkButton(false);
                    $('#bookmarkSurahBtn').style.display = 'none';

                    const [arabicData, translationData] = await Promise.all([
                        fetchJSON(`${API_BASE}/juz/${juzNumber}/ar.asad`),
                        fetchJSON(`${API_BASE}/juz/${juzNumber}/${state.selectedTranslation}`),
                    ]);

                    const ayahs = arabicData.data.ayahs.map((a, i) => ({
                        number: a.numberInSurah,
                        surahNumber: a.surah.number,
                        surahName: a.surah.name,
                        arabic: a.text,
                        translation: translationData.data.ayahs[i]?.text || '',
                        isSajda: false,
                    }));

                    ayahList.innerHTML = ayahs.map((a, idx) => `
                        <div class="ayah-card" id="ayah-${a.number}">
                            <div style="font-size:0.7rem;color:var(--gold);font-weight:600;margin-bottom:4px;">
                                Sure ${a.surahNumber} · Vers ${a.number}
                            </div>
                            <div class="ayah-arabic">
                                ${a.arabic}
                                <span class="ayah-number-inline">${a.number}</span>
                            </div>
                            <div class="ayah-translation">${a.translation}</div>
                            <div class="ayah-audio-row">
                                <button class="audio-play-btn" data-play-ayah="${idx}" data-surah="${a.surahNumber}" data-ayah="${a.number}" aria-label="Vers ${a.number} abspielen">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                    Anhören
                                </button>
                            </div>
                        </div>
                    `).join('');

                    openOverlay(ayahViewer);
                } catch (err) {
                    console.error('Fehler beim Laden des Juz:', err);
                    showToast('Fehler beim Laden des Juz\'.');
                }
            }

            // ──────────────── Start ────────────────
            init();
            console.log(
                '%c☽ Al-Quran Al-Karim %cgeladen',
                'font-size:1.2em;color:#b8860b;font-weight:bold;',
                'color:inherit;'
            );
            console.log('%cAPI: https://alquran.cloud/ %c| %cMobile-First • Barrierefrei • Modern',
                'color:#6b5e4a;', '', 'color:#1a6b52;');

        })();
    </script>
</body>
</html>
