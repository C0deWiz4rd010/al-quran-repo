            const statsBar = $('#statsBar');
            const btnTheme = $('#btnTheme');
            const bookmarkSurahBtn = $('#bookmarkSurahBtn');
            const mainContent = $('#mainContent');

            // ──────────────── Fallback-Editions für den Fall dass die Übersetzung nicht verfügbar ist ────────────────
            const FALLBACK_TRANSLATIONS = ['de.aburida', 'de.khoury', 'de.bubenheim', 'en.sahih', 'en.pickthall',
                'ar.jalalayn'
            ];
            const FALLBACK_AUDIO = ['ar.abdurrahmaansudais', 'ar.abdulsamad', 'ar.ahmedajamy', 'ar.alafasy'];
            const FALLBACK_ARABIC = 'ar.asad'; // Standard arabischer Text

            function getValidTranslation() {
                // Wenn die aktuelle Übersetzung in den verfügbaren Editionen existiert, nutze sie
                if (state.editions.some(e => e.identifier === state.selectedTranslation)) {
                    return state.selectedTranslation;
                }
                // Sonst nimm die erste verfügbare aus der Fallback-Liste
                for (const fb of FALLBACK_TRANSLATIONS) {
                    if (state.editions.some(e => e.identifier === fb)) return fb;
                }
                return FALLBACK_TRANSLATIONS[0];
            }

            function getValidAudio() {
                if (state.editions.some(e => e.identifier === state.selectedAudio && e.type === 'audio')) {
                    return state.selectedAudio;
                }
                for (const fb of FALLBACK_AUDIO) {
                    if (state.editions.some(e => e.identifier === fb && e.type === 'audio')) return fb;
                }
                return FALLBACK_AUDIO[0];
            }

            // ──────────────── Init ────────────────
            function init() {
                applyTheme();
                updateAllI18n();
                updateUILanguageSelection();
                loadAllData();
                setupEventListeners();
                setupArabicFont();
            }

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', state.theme);
                const icon = state.theme === 'dark' ?
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>' :
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
                btnTheme.innerHTML = icon;
            }

            function updateAllI18n() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (el.tagName === 'INPUT' && el.dataset.i18nPlaceholder) {
                        el.placeholder = t(el.dataset.i18nPlaceholder);
                    }
                    if (el.children.length === 0 || el.dataset.i18nForce) {
                        el.textContent = t(key);
                    }
                });
                // Spezielle Elemente die Kinder haben aber trotzdem Text
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    // Nur Textknoten aktualisieren
                    for (const node of el.childNodes) {
                        if (node.nodeType === 3 && node.textContent.trim()) {
                            node.textContent = ' ' + t(key) + ' ';
                            break;
                        }
                    }
                });
                // Buttons in nav und stats die span enthalten
                document.querySelectorAll('.nav-item span, .stat-chip span').forEach(span => {
                    const parent = span.parentElement;
                    const i18nKey = parent.dataset.nav || parent.dataset.view;
                    if (i18nKey && i18n[state.uiLang]) {
                        const map = {
                            'surahs': 'navSurahs',
                            'juz': 'navJuz',
                            'sajda': 'navSajda',
                            'bookmarks': 'tabBookmarks'
                        };
                        const tk = map[i18nKey] || ('tab' + i18nKey.charAt(0).toUpperCase() + i18nKey.slice(
                            1));
                        if (t(tk) !== tk) span.textContent = t(tk);
                    }
                });
                searchInput.placeholder = t('searchPlaceholder');
            }

            function updateUILanguageSelection() {
                $$('#uiLanguageOptions .setting-option').forEach(o => o.classList.remove('selected'));
                const sel = document.querySelector(`#uiLanguageOptions [data-lang="${state.uiLang}"]`);
                if (sel) sel.classList.add('selected');
            }

            function setupArabicFont() {
                const styleEl = document.getElementById('arabic-font-style') || document.createElement('style');
                styleEl.id = 'arabic-font-style';
                const fontFamily = state.selectedArabicFont === 'amiri' ?
                    "'Amiri', 'Scheherazade New', serif" :
                    "'Scheherazade New', 'Amiri', serif";
                styleEl.textContent = `
                    .ayah-arabic, .surah-arabic-name {
                        font-family: ${fontFamily};
                    }
                `;
                if (!document.getElementById('arabic-font-style')) {
                    document.head.appendChild(styleEl);
                }
            }

            // ──────────────── API Calls ────────────────
            const API_BASE = 'https://api.alquran.cloud/v1';

            async function fetchJSON(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`API-Fehler: ${res.status} für ${url}`);
                return res.json();
            }

            async function loadAllData() {
                try {
                    showSkeleton();
                    const [surahsData, editionsData] = await Promise.all([
                        fetchJSON(`${API_BASE}/surah`),
                        fetchJSON(`${API_BASE}/edition`),
                    ]);
                    state.surahs = surahsData.data;
                    state.editions = editionsData.data;

                    // Validierung: Falls die gespeicherte Edition nicht existiert, auf Fallback setzen
                    const validTrans = getValidTranslation();
                    if (validTrans !== state.selectedTranslation) {
                        state.selectedTranslation = validTrans;
                        localStorage.setItem('quran_translation', validTrans);
                    }
                    const validAudio = getValidAudio();
                    if (validAudio !== state.selectedAudio) {
                        state.selectedAudio = validAudio;
                        localStorage.setItem('quran_audio', validAudio);
                    }

                    renderSurahList();
                    renderJuzGrid();
                    loadSajdaVerses();
                    populateSettings();
                    hideSkeleton();
                    loadSearchData();
                } catch (err) {
                    console.error('Ladefehler:', err);
                    hideSkeleton();
                    showToast(t('loadError'));
                }
            }

            async function loadSearchData() {
                try {
                    const validTrans = getValidTranslation();
                    const data = await fetchJSON(
                        `${API_BASE}/quran/${validTrans}`);
                    state.allAyahsForSearch = data.data.surahs.flatMap(s => s.ayahs.map(a => ({
                        surahNumber: s.number,
                        surahName: s.englishName,
                        ayahNumber: a.numberInSurah,
                        text: a.text,
                    })));
                } catch (e) {
                    console.warn('Suchdaten konnten nicht geladen werden:', e);
                }
            }

            async function loadSajdaVerses() {
                try {
                    const validTrans = getValidTranslation();
                    const data = await fetchJSON(`${API_BASE}/sajda/${validTrans}`);
                    state.sajdaData = data.data;
                    if (state.currentView === 'sajda') renderSajdaList();
                } catch (e) {
                    console.warn('Sajda-Daten konnten nicht geladen werden:', e);
                    state.sajdaData = [];
                }
            }

            function showSkeleton() {
                surahList.innerHTML = Array.from({ length: 10 }, () =>
                    '<div class="surah-card"><div class="skeleton" style="width:44px;height:44px;border-radius:14px;"></div><div style="flex:1;"><div class="skeleton" style="height:16px;width:60%;margin-bottom:6px;border-radius:8px;"></div><div class="skeleton" style="height:12px;width:40%;border-radius:6px;"></div></div><div class="skeleton" style="width:50px;height:20px;border-radius:10px;"></div></div>'
                ).join('');
            }

            function hideSkeleton() { /* wird durch Rendering überschrieben */ }

            // ──────────────── Render Functions ────────────────
            function renderSurahList() {
                if (!state.surahs.length) return;
                surahList.innerHTML = state.surahs.map(s => `
                    <div class="surah-card" role="button" tabindex="0"
                         data-surah="${s.number}"
                         aria-label="Sure ${s.number}: ${s.englishName}"
                         data-view="surah">
                        <div class="surah-number">${s.number}</div>
                        <div class="surah-info">
                            <div class="surah-english">${s.englishName}</div>
                            <div class="surah-meta">
                                <span>${s.englishNameTranslation}</span>
                                <span>·</span>
                                <span>${s.numberOfAyahs} ${t('verses')}</span>
                            </div>
                        </div>
                        <span class="surah-arabic-name">${s.name}</span>
                        <span class="surah-badge ${s.revelationType === 'Meccan' ? 'badge-meccan' : 'badge-medinan'}">${s.revelationType === 'Meccan' ? t('mecca') : t('medina')}</span>
                    </div>
                `).join('');
            }

            function renderJuzGrid() {
                juzGrid.innerHTML = Array.from({ length: 30 }, (_, i) => `
                    <div class="juz-chip" role="button" tabindex="0"
                         data-juz="${i + 1}"
                         aria-label="Juz' ${i + 1}"
                         data-view="juz-detail">
                        ${i + 1}
                    </div>
                `).join('');
            }

            function renderSajdaList() {
                if (!state.sajdaData || !state.sajdaData.length) {
                    sajdaList.innerHTML =
                        `<div class="empty-state"><div class="empty-state-icon">🕌</div><div class="empty-state-text">${t('emptySajda')}</div></div>`;
                    return;
                }
                sajdaList.innerHTML = state.sajdaData.map(item => {
                    const surah = state.surahs.find(s => s.number === item.surah.number);
                    return `
                    <div class="surah-card" role="button" tabindex="0"
                         data-surah="${item.surah.number}"
                         data-ayah-scroll="${item.ayah.number}"
                         aria-label="Sajda: Sure ${item.surah.number}, Vers ${item.ayah.number}"
                         data-view="surah">
                        <div class="surah-number" style="background:var(--gold-pale);color:var(--gold);">🕌</div>
                        <div class="surah-info">
                            <div class="surah-english">${t('surah')} ${item.surah.number}: ${item.surah.englishName || surah?.englishName || ''}</div>
                            <div class="surah-meta">${t('ayah')} ${item.ayah.number} · ${t('sajdaLabel')}</div>
                        </div>
                        <span class="surah-arabic-name">${item.surah.name || surah?.name || ''}</span>
                    </div>
                `;
                }).join('');
            }

            function renderBookmarksList() {
                if (!state.bookmarks.length) {
                    bookmarksList.innerHTML =
                        `<div class="empty-state"><div class="empty-state-icon">📑</div><div class="empty-state-text">${t('noBookmarks')}</div></div>`;
                    return;
                }
                bookmarksList.innerHTML = state.bookmarks.map((bm, idx) => {
                    const surah = state.surahs.find(s => s.number === bm.surahNumber);
                    return `
                    <div class="surah-card" role="button" tabindex="0"
                         data-surah="${bm.surahNumber}"
                         data-view="surah"
                         aria-label="Lesezeichen: Sure ${bm.surahNumber}">
                        <div class="surah-number">${bm.surahNumber}</div>
                        <div class="surah-info">
                            <div class="surah-english">${surah ? surah.englishName : t('surah') + ' ' + bm.surahNumber}</div>
                            <div class="bookmark-indicator">★ ${t('btnBookmark')}</div>
                        </div>
                        <span class="surah-arabic-name">${surah ? surah.name : ''}</span>
                        <button class="icon-btn" data-remove-bookmark="${idx}" aria-label="Lesezeichen entfernen"
                                style="position:relative;z-index:2;flex-shrink:0;"
                                onclick="event.stopPropagation();">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--gold)" stroke="none"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                        </button>
                    </div>
                `;
                }).join('');
            }

            // ──────────────── Ayah Viewer ────────────────
            async function openSurahViewer(surahNumber, scrollToAyah = null) {
                try {
                    ayahList.innerHTML = Array.from({ length: 5 }, () =>
                        '<div class="ayah-card"><div class="skeleton" style="height:60px;border-radius:12px;margin-bottom:10px;"></div><div class="skeleton" style="height:40px;border-radius:8px;"></div></div>'
                    ).join('');
                    const surah = state.surahs.find(s => s.number === surahNumber);
                    viewerSurahTitle.textContent = surah ?
                        `${t('surah')} ${surah.number}: ${surah.englishName}` :
                        `${t('surah')} ${surahNumber}`;

                    const isBookmarked = state.bookmarks.some(b => b.surahNumber === surahNumber);
                    updateBookmarkButton(isBookmarked);
                    bookmarkSurahBtn.style.display = '';

                    // Verwende validierte Editionen
                    const validTrans = getValidTranslation();
                    const validArabic = FALLBACK_ARABIC;

                    const [arabicData, translationData] = await Promise.all([
                        fetchJSON(`${API_BASE}/surah/${surahNumber}`),
                        fetchJSON(`${API_BASE}/surah/${surahNumber}/${validTrans}`),
                    ]);

                    const sajdaAyahs = (state.sajdaData || [])
                        .filter(s => s.surah.number === surahNumber)
                        .map(s => s.ayah.number);

                    const ayahs = arabicData.data.ayahs.map((a, i) => ({
                        number: a.numberInSurah,
                        arabic: a.text,
                        translation: translationData.data.ayahs[i]?.text || '(Übersetzung nicht verfügbar)',
                        isSajda: sajdaAyahs.includes(a.numberInSurah),
                    }));

                    renderAyahs(ayahs, surahNumber, scrollToAyah);
                    openOverlay(ayahViewer);
                } catch (err) {
                    console.error('Fehler beim Laden der Sure:', err);
                    showToast(t('ayahLoadError'));
                    // Fallback: Versuche es mit einer anderen Übersetzung
                    tryAlternativeTranslation(surahNumber, scrollToAyah);
                }
            }

            async function tryAlternativeTranslation(surahNumber, scrollToAyah) {
                // Probiere alle Fallback-Übersetzungen durch
                for (const fb of FALLBACK_TRANSLATIONS) {
                    try {
                        if (fb === state.selectedTranslation) continue;
                        const [arabicData, translationData] = await Promise.all([
                            fetchJSON(`${API_BASE}/surah/${surahNumber}`),
                            fetchJSON(`${API_BASE}/surah/${surahNumber}/${fb}`),
                        ]);
                        const ayahs = arabicData.data.ayahs.map((a, i) => ({
                            number: a.numberInSurah,
                            arabic: a.text,
                            translation: translationData.data.ayahs[i]?.text ||
                                '(Übersetzung nicht verfügbar)',
                            isSajda: false,
                        }));
                        // Aktualisiere die gespeicherte Edition
                        state.selectedTranslation = fb;
                        localStorage.setItem('quran_translation', fb);
                        populateSettings();
                        renderAyahs(ayahs, surahNumber, scrollToAyah);
                        showToast('Übersetzung auf ' + fb + ' geändert');
                        return;
                    } catch (e) {
                        continue;
                    }
                }
                ayahList.innerHTML =
                    '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Keine Übersetzung verfügbar. Bitte wähle eine andere in den Einstellungen.</div></div>';
            }

            function renderAyahs(ayahs, surahNumber, scrollToAyah) {
                ayahList.innerHTML = ayahs.map((a, idx) => `
                    <div class="ayah-card ${a.isSajda ? 'sajda' : ''} ${scrollToAyah && a.number === scrollToAyah ? 'current' : ''}"
                         id="ayah-${a.number}" data-ayah="${a.number}">
                        <div class="ayah-arabic">
                            ${a.arabic}
                            <span class="ayah-number-inline">${a.number}</span>
                        </div>
                        <div class="ayah-translation">${a.translation}</div>
                        <div class="ayah-audio-row">
                            <button class="audio-play-btn" data-play-ayah="${idx}" data-surah="${surahNumber}" data-ayah="${a.number}" aria-label="${t('listen')}: Vers ${a.number}">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                ${t('listen')}
                            </button>
                            ${a.isSajda ? `<span style="font-size:0.7rem;color:var(--gold);font-weight:600;">🕌 ${t('sajdaLabel')}</span>` : ''}
                        </div>
                    </div>
                `).join('');

                if (scrollToAyah) {
                    setTimeout(() => {
                        const el = document.getElementById(`ayah-${scrollToAyah}`);
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 400);
                }
            }

            function updateBookmarkButton(isBookmarked) {
                if (isBookmarked) {
                    bookmarkSurahBtn.innerHTML =
                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="var(--gold)" stroke="var(--gold)" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
                    bookmarkSurahBtn.style.color = 'var(--gold)';
                } else {
                    bookmarkSurahBtn.innerHTML =
                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
                    bookmarkSurahBtn.style.color = '';
                }
            }

            // ──────────────── Juz Loading ────────────────
            async function loadJuzAyahs(juzNumber) {
                try {
                    ayahList.innerHTML = Array.from({ length: 3 }, () =>
                        '<div class="ayah-card"><div class="skeleton" style="height:60px;border-radius:12px;margin-bottom:10px;"></div><div class="skeleton" style="height:40px;border-radius:8px;"></div></div>'
                    ).join('');
                    viewerSurahTitle.textContent = `${t('juzDetail')} ${juzNumber}`;
                    bookmarkSurahBtn.style.display = 'none';
                    updateBookmarkButton(false);

                    const validTrans = getValidTranslation();

                    const [arabicData, translationData] = await Promise.all([
                        fetchJSON(`${API_BASE}/juz/${juzNumber}/ar.asad`),
                        fetchJSON(`${API_BASE}/juz/${juzNumber}/${validTrans}`),
                    ]);

                    const ayahs = arabicData.data.ayahs.map((a, i) => ({
                        number: a.numberInSurah,
                        surahNumber: a.surah.number,
                        surahName: a.surah.name,
                        arabic: a.text,
                        translation: translationData.data.ayahs[i]?.text || '(Übersetzung nicht verfügbar)',
                        isSajda: false,
                    }));

                    ayahList.innerHTML = ayahs.map((a, idx) => `
                        <div class="ayah-card" id="ayah-${a.number}">
                            <div style="font-size:0.7rem;color:var(--gold);font-weight:600;margin-bottom:4px;">
                                ${t('surah')} ${a.surahNumber} · ${t('ayah')} ${a.number}
                            </div>
                            <div class="ayah-arabic">
                                ${a.arabic}
                                <span class="ayah-number-inline">${a.number}</span>
                            </div>
                            <div class="ayah-translation">${a.translation}</div>
                            <div class="ayah-audio-row">
                                <button class="audio-play-btn" data-play-ayah="${idx}" data-surah="${a.surahNumber}" data-ayah="${a.number}" aria-label="${t('listen')}: Vers ${a.number}">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                    ${t('listen')}
                                </button>
                            </div>
                        </div>
                    `).join('');

                    openOverlay(ayahViewer);
                } catch (err) {
                    console.error('Fehler beim Laden des Juz:', err);
                    showToast(t('ayahLoadError'));
                    // Fallback für Juz
                    try {
                        for (const fb of FALLBACK_TRANSLATIONS) {
                            try {
                                if (fb === state.selectedTranslation) continue;
                                const [arabicData, translationData] = await Promise.all([
                                    fetchJSON(`${API_BASE}/juz/${juzNumber}/ar.asad`),
                                    fetchJSON(`${API_BASE}/juz/${juzNumber}/${fb}`),
                                ]);
                                const ayahs = arabicData.data.ayahs.map((a, i) => ({
                                    number: a.numberInSurah,
                                    surahNumber: a.surah.number,
                                    arabic: a.text,
                                    translation: translationData.data.ayahs[i]?.text || '',
                                    isSajda: false,
                                }));
                                state.selectedTranslation = fb;
                                localStorage.setItem('quran_translation', fb);
                                populateSettings();
                                ayahList.innerHTML = ayahs.map((a, idx) => `
                                    <div class="ayah-card">
                                        <div style="font-size:0.7rem;color:var(--gold);font-weight:600;margin-bottom:4px;">${t('surah')} ${a.surahNumber} · ${t('ayah')} ${a.number}</div>
                                        <div class="ayah-arabic">${a.arabic}<span class="ayah-number-inline">${a.number}</span></div>
                                        <div class="ayah-translation">${a.translation}</div>
                                        <div class="ayah-audio-row">
                                            <button class="audio-play-btn" data-play-ayah="${idx}" data-surah="${a.surahNumber}" data-ayah="${a.number}">▶ ${t('listen')}</button>
                                        </div>
                                    </div>
                                `).join('');
                                showToast('Übersetzung auf ' + fb + ' geändert');
                                return;
                            } catch (e2) { continue; }
                        }
                    } catch (e3) {
                        ayahList.innerHTML =
                            '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Keine Übersetzung verfügbar.</div></div>';
                    }
                }
            }

            // ──────────────── Audio ────────────────
            function playAyahAudio(surahNumber, ayahNumber) {
                const validAudio = getValidAudio();
                const url = `${API_BASE}/ayah/${surahNumber}:${ayahNumber}/${validAudio}`;
                audioElement.src = url;
                audioElement.play().catch(() => showToast('Audio konnte nicht abgespielt werden.'));
                state.currentAudioSurah = surahNumber;
                state.currentAudioAyah = ayahNumber;
                state.isPlaying = true;
                updateAudioUI();
                audioPlayerBar.classList.remove('hidden');
                const surah = state.surahs.find(s => s.number === surahNumber);
                audioInfo.textContent =
                    `${t('surah')} ${surahNumber}${surah ? ' · ' + surah.englishName : ''} · ${t('ayah')} ${ayahNumber}`;
            }

            function updateAudioUI() {
                audioPlayPause.textContent = state.isPlaying ? '⏸' : '▶';
                $$('.audio-play-btn').forEach(btn => {
                    const sa = parseInt(btn.dataset.surah);
                    const aa = parseInt(btn.dataset.ayah);
                    if (sa === state.currentAudioSurah && aa === state.currentAudioAyah && state.isPlaying) {
                        btn.classList.add('playing');
                        btn.innerHTML =
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="16"/><rect x="14" y="4" width="6" height="16"/></svg> ' +
                            t('pause');
                    } else {
                        btn.classList.remove('playing');
                        btn.innerHTML =
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> ' +
                            t('listen');
                    }
                });
            }

            // ──────────────── Overlay Management ────────────────
            function openOverlay(overlay) {
                overlay.style.display = 'flex';
                overlay.setAttribute('aria-hidden', 'false');
                overlay.classList.remove('closing');
                document.body.style.overflow = 'hidden';
                const firstFocusable = overlay.querySelector('button, [tabindex]');
                if (firstFocusable) setTimeout(() => firstFocusable.focus(), 100);
            }

            function closeOverlay(overlay) {
                overlay.classList.add('closing');
                overlay.setAttribute('aria-hidden', 'true');
                setTimeout(() => {
                    overlay.style.display = 'none';
                    overlay.classList.remove('closing');
                    document.body.style.overflow = '';
                }, 250);
            }

            // ──────────────── View Switching ────────────────
            function switchView(view) {
                state.currentView = view;
                [surahListView, juzView, sajdaView, bookmarksView].forEach(v => v.style.display = 'none');
                $$('.nav-item').forEach(n => n.classList.remove('active'));
                $$('.stat-chip').forEach(c => c.classList.remove('active'));

                const viewMap = {
                    'surahs': { content: surahListView, nav: '[data-nav="surahs"]', chip: '[data-view="surahs"]' },
                    'juz': { content: juzView, nav: '[data-nav="juz"]', chip: '[data-view="juz"]' },
                    'sajda': { content: sajdaView, nav: '[data-nav="sajda"]', chip: '[data-view="sajda"]' },
                    'bookmarks': { content: bookmarksView, nav: null, chip: '[data-view="bookmarks"]' },
                };

                const cfg = viewMap[view];
                if (cfg) {
                    cfg.content.style.display = 'block';
                    if (cfg.nav) document.querySelector(cfg.nav)?.classList.add('active');
                    document.querySelector(cfg.chip)?.classList.add('active');
                }

                if (view === 'sajda') renderSajdaList();
                if (view === 'bookmarks') renderBookmarksList();

                mainContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ──────────────── Search ────────────────
            function performSearch(query) {
                if (!query || query.length < 2) {
                    searchResults.classList.remove('open');
                    return;
                }
                const q = query.toLowerCase();
                const surahMatches = state.surahs.filter(s =>
                    s.englishName.toLowerCase().includes(q) ||
                    s.englishNameTranslation.toLowerCase().includes(q) ||
                    s.name.includes(q) ||
                    String(s.number).includes(q)
                );

                const ayahMatches = state.allAyahsForSearch.filter(a =>
                    a.text.toLowerCase().includes(q)
                ).slice(0, 20);

                let html = '';
                if (surahMatches.length > 0) {
                    html +=
                        `<div style="padding:8px 16px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);font-weight:600;">${t('navSurahs')}</div>`;
                    html += surahMatches.slice(0, 8).map(s => `
                        <div class="search-result-item" data-surah="${s.number}" data-view="surah" role="option" tabindex="0">
                            <span class="search-result-surah">${t('surah')} ${s.number}</span>
                            <span class="search-result-text">${s.englishName} · ${s.englishNameTranslation}</span>
                        </div>
                    `).join('');
                }
                if (ayahMatches.length > 0) {
                    html +=
                        `<div style="padding:8px 16px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);font-weight:600;">${t('tabBookmarks').replace('Gemerkt','Verse')}</div>`;
                    html += ayahMatches.slice(0, 10).map(a => `
                        <div class="search-result-item" data-surah="${a.surahNumber}" data-ayah-scroll="${a.ayahNumber}" data-view="surah" role="option" tabindex="0">
                            <span class="search-result-surah">${a.surahNumber}:${a.ayahNumber}</span>
                            <span class="search-result-text">${a.text}</span>
                        </div>
                    `).join('');
                }
                if (!html) {
                    html =
                        '<div class="search-result-item" style="color:var(--text-muted);">Keine Ergebnisse gefunden.</div>';
                }
                searchResults.innerHTML = html;
                searchResults.classList.add('open');
            }

            // ──────────────── Settings ────────────────
            function populateSettings() {
                if (!state.editions) return;
                const translations = state.editions.filter(e => e.type === 'translation');
                const audioEditions = state.editions.filter(e => e.type === 'audio' && e.format === 'audio');

                const transOptions = $('#translationOptions');
                // Zeige alle Sprach-Optionen, priorisiere DE > EN > AR
                const langOrder = { 'de': 1, 'en': 2, 'ar': 3 };
                const sortedTrans = translations.sort((a, b) => (langOrder[a.language] || 9) - (langOrder[b
                    .language] || 9));
                transOptions.innerHTML = sortedTrans.slice(0, 30).map(t => `
                    <button class="setting-option ${state.selectedTranslation === t.identifier ? 'selected' : ''}"
                            data-translation="${t.identifier}">
                        ${t.englishName} (${t.language})
                    </button>
                `).join('');

                const audioOpts = $('#audioOptions');
                audioOpts.innerHTML = audioEditions.slice(0, 20).map(a => `
                    <button class="setting-option ${state.selectedAudio === a.identifier ? 'selected' : ''}"
                            data-audio="${a.identifier}">
                        ${a.englishName}
                    </button>
                `).join('');
            }

            function changeTranslation(identifier) {
                state.selectedTranslation = identifier;
                localStorage.setItem('quran_translation', identifier);
                $$('#translationOptions .setting-option').forEach(o => o.classList.remove('selected'));
                const opt = document.querySelector(`[data-translation="${identifier}"]`);
                if (opt) opt.classList.add('selected');
                showToast(t('translationUpdated'));
                loadSearchData();
                loadSajdaVerses();
            }

            function changeAudio(identifier) {
                state.selectedAudio = identifier;
                localStorage.setItem('quran_audio', identifier);
                $$('#audioOptions .setting-option').forEach(o => o.classList.remove('selected'));
                const opt = document.querySelector(`[data-audio="${identifier}"]`);
                if (opt) opt.classList.add('selected');
                showToast(t('reciterUpdated'));
                stopAudio();
            }

            function changeArabicFont(font) {
                state.selectedArabicFont = font;
                localStorage.setItem('quran_arabic_font', font);
                $$('#arabicFontOptions .setting-option').forEach(o => o.classList.remove('selected'));
                const opt = document.querySelector(`[data-font="${font}"]`);
                if (opt) opt.classList.add('selected');
                setupArabicFont();
                showToast(t('fontUpdated'));
            }

            function changeUILanguage(lang) {
                state.uiLang = lang;
                localStorage.setItem('quran_ui_lang', lang);
                updateAllI18n();
                updateUILanguageSelection();
                // Rerender dynamische Texte
                renderSurahList();
                if (state.currentView === 'sajda') renderSajdaList();
                if (state.currentView === 'bookmarks') renderBookmarksList();
                showToast(t('languageUpdated'));
                // Setze HTML lang-Attribut
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                // Bei Arabisch andere Schriftgrößen für UI
                if (lang === 'ar') {
                    document.body.style.fontFamily = "'Scheherazade New', 'Amiri', 'Inter', sans-serif";
                } else {
                    document.body.style.fontFamily = "'Inter', system-ui, -apple-system, sans-serif";
                }
            }

            function stopAudio() {
                audioElement.pause();
                audioElement.src = '';
                state.isPlaying = false;
                state.currentAudioSurah = null;
                state.currentAudioAyah = null;
                updateAudioUI();
                audioPlayerBar.classList.add('hidden');
            }

            // ──────────────── Bookmarks ────────────────
            function toggleBookmark(surahNumber) {
                const idx = state.bookmarks.findIndex(b => b.surahNumber === surahNumber);
                if (idx >= 0) {
                    state.bookmarks.splice(idx, 1);
                    showToast(t('bookmarkRemoved'));
                } else {
                    state.bookmarks.push({ surahNumber, addedAt: Date.now() });
                    showToast(t('bookmarkAdded'));
                }
                localStorage.setItem('quran_bookmarks', JSON.stringify(state.bookmarks));
                const isBookmarked = state.bookmarks.some(b => b.surahNumber === surahNumber);
                updateBookmarkButton(isBookmarked);
                if (state.currentView === 'bookmarks') renderBookmarksList();
            }

            // ──────────────── Toast ────────────────
            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('visible');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('visible'), 2200);
            }

            // ──────────────── Event Listeners ────────────────
            function setupEventListeners() {
                // Surah card clicks – im Surah-List-Container
                surahList.addEventListener('click', (e) => {
                    const card = e.target.closest('[data-surah]');
                    if (!card) return;
                    const surahNumber = parseInt(card.dataset.surah);
                    const ayahScroll = card.dataset.ayahScroll ? parseInt(card.dataset.ayahScroll) : null;
                    openSurahViewer(surahNumber, ayahScroll);
                });

                // Juz grid clicks
                juzGrid.addEventListener('click', (e) => {
                    const chip = e.target.closest('[data-juz]');
                    if (!chip) return;
                    const juzNumber = parseInt(chip.dataset.juz);
                    loadJuzAyahs(juzNumber);
                });

                // Sajda list clicks
                sajdaList.addEventListener('click', (e) => {
                    const card = e.target.closest('[data-surah]');
                    if (!card) return;
                    const surahNumber = parseInt(card.dataset.surah);
                    const ayahScroll = card.dataset.ayahScroll ? parseInt(card.dataset.ayahScroll) : null;
                    openSurahViewer(surahNumber, ayahScroll);
                });

                // Bookmarks list clicks
                bookmarksList.addEventListener('click', (e) => {
                    const removeBtn = e.target.closest('[data-remove-bookmark]');
                    if (removeBtn) {
                        const idx = parseInt(removeBtn.dataset.removeBookmark);
                        state.bookmarks.splice(idx, 1);
                        localStorage.setItem('quran_bookmarks', JSON.stringify(state.bookmarks));
                        renderBookmarksList();
                        showToast(t('bookmarkRemoved'));
                        return;
                    }
                    const card = e.target.closest('[data-surah]');
                    if (!card) return;
                    const surahNumber = parseInt(card.dataset.surah);
                    openSurahViewer(surahNumber);
                });

                // Ayah viewer audio buttons
                ayahList.addEventListener('click', (e) => {
                    const playBtn = e.target.closest('[data-play-ayah]');
                    if (!playBtn) return;
                    const surahNumber = parseInt(playBtn.dataset.surah);
                    const ayahNumber = parseInt(playBtn.dataset.ayah);
                    if (state.currentAudioSurah === surahNumber && state.currentAudioAyah === ayahNumber &&
                        state.isPlaying) {
                        audioElement.pause();
                        state.isPlaying = false;
                        updateAudioUI();
                    } else if (state.currentAudioSurah === surahNumber && state.currentAudioAyah === ayahNumber &&
                        !state.isPlaying) {
                        audioElement.play().catch(() => {});
                        state.isPlaying = true;
                        updateAudioUI();
                    } else {
                        playAyahAudio(surahNumber, ayahNumber);
                    }
                });

                // Back from viewer
                $('#backFromViewer').addEventListener('click', () => {
                    closeOverlay(ayahViewer);
                    stopAudio();
                });

                // Bookmark in viewer
                bookmarkSurahBtn.addEventListener('click', () => {
                    const titleText = viewerSurahTitle.textContent;
                    const match = titleText.match(/\d+/);
                    if (match) toggleBookmark(parseInt(match[0]));
                });

                // Search
                searchInput.addEventListener('input', () => {
                    clearTimeout(state.searchTimeout);
                    state.searchTimeout = setTimeout(() => {
                        performSearch(searchInput.value.trim());
                    }, 250);
                });
                searchInput.addEventListener('focus', () => {
                    if (searchInput.value.trim().length >= 2) performSearch(searchInput.value.trim());
                });
                document.addEventListener('click', (e) => {
                    if (!searchResults.contains(e.target) && e.target !== searchInput) {
                        searchResults.classList.remove('open');
                    }
                });
                searchResults.addEventListener('click', (e) => {
                    const item = e.target.closest('[data-surah]');
                    if (!item) return;
                    const surahNumber = parseInt(item.dataset.surah);
                    const ayahScroll = item.dataset.ayahScroll ? parseInt(item.dataset.ayahScroll) : null;
                    searchResults.classList.remove('open');
                    searchInput.value = '';
                    openSurahViewer(surahNumber, ayahScroll);
                });
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        searchResults.classList.remove('open');
                        searchInput.blur();
                    }
                });

                // Settings
                $('#btnSettings').addEventListener('click', () => openOverlay(settingsPanel));
                $('#closeSettings').addEventListener('click', () => closeOverlay(settingsPanel));

                // UI Language
                $('#uiLanguageOptions').addEventListener('click', (e) => {
                    const opt = e.target.closest('[data-lang]');
                    if (opt) changeUILanguage(opt.dataset.lang);
                });

                // Translation
                $('#translationOptions').addEventListener('click', (e) => {
                    const opt = e.target.closest('[data-translation]');
                    if (opt) changeTranslation(opt.dataset.translation);
                });

                // Audio
                $('#audioOptions').addEventListener('click', (e) => {
                    const opt = e.target.closest('[data-audio]');
                    if (opt) changeAudio(opt.dataset.audio);
                });

                // Arabic Font
                $('#arabicFontOptions').addEventListener('click', (e) => {
                    const opt = e.target.closest('[data-font]');
                    if (opt) changeArabicFont(opt.dataset.font);
                });

                // Theme toggle
                btnTheme.addEventListener('click', () => {
                    state.theme = state.theme === 'light' ? 'dark' : 'light';
                    localStorage.setItem('quran_theme', state.theme);
                    applyTheme();
                });

                // Audio player controls
                audioPlayPause.addEventListener('click', () => {
                    if (state.isPlaying) {
                        audioElement.pause();
                        state.isPlaying = false;
                    } else if (state.currentAudioSurah && state.currentAudioAyah) {
                        audioElement.play().catch(() => {});
                        state.isPlaying = true;
                    }
                    updateAudioUI();
                });
                $('#audioClose').addEventListener('click', stopAudio);

                audioElement.addEventListener('ended', () => {
                    state.isPlaying = false;
                    updateAudioUI();
                });
                audioElement.addEventListener('pause', () => {
                    if (!audioElement.ended) {
                        state.isPlaying = false;
                        updateAudioUI();
                    }
                });
                audioElement.addEventListener('play', () => {
                    state.isPlaying = true;
                    updateAudioUI();
                });

                // Bottom nav
                $$('.nav-item').forEach(btn => {
                    btn.addEventListener('click', () => switchView(btn.dataset.nav));
                });

                // Stats bar
                statsBar.addEventListener('click', (e) => {
                    const chip = e.target.closest('[data-view]');
                    if (!chip) return;
                    switchView(chip.dataset.view);
                });

                // Header bookmarks button
                $('#btnBookmarks').addEventListener('click', () => switchView('bookmarks'));

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (ayahViewer.style.display === 'flex') {
                            closeOverlay(ayahViewer);
                            stopAudio();
                        }
                        if (settingsPanel.style.display === 'flex') {
                            closeOverlay(settingsPanel);
                        }
                        searchResults.classList.remove('open');
                    }
                });

                // Close overlays on backdrop click
                ayahViewer.addEventListener('click', function(e) {
                    if (e.target === ayahViewer) {
                        closeOverlay(ayahViewer);
                        stopAudio();
                    }
                });
                settingsPanel.addEventListener('click', function(e) {
                    if (e.target === settingsPanel) {
                        closeOverlay(settingsPanel);
                    }
                });
            }

            // ──────────────── Start ────────────────
            document.documentElement.lang = state.uiLang;
            if (state.uiLang === 'ar') {
                document.documentElement.dir = 'rtl';
                document.body.style.fontFamily = "'Scheherazade New', 'Amiri', 'Inter', sans-serif";
            }
            init();
            console.log('%c☽ Al-Quran Al-Karim %cgeladen',
                'font-size:1.2em;color:#b8860b;font-weight:bold;', 'color:inherit;');
            console.log('%cAPI: https://alquran.cloud/ %c| %cMobile-First • Barrierefrei • i18n',
                'color:#6b5e4a;', '', 'color:#1a6b52;');
        })();
    </script>
</body>
</html>
